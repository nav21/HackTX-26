# Pings the Render API every 5 minutes so the free instance doesn't sleep.
# The scheduler (reminders, missed doses, alerts) only runs while the server is awake.
#
# Private repo: each run bills ~1 Actions minute (~290/day of the 2,000 free/month).
# Disable after the hackathon:  gh workflow disable keep-awake.yml
name: keep-awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          # A sleeping instance can take ~60 s to wake, so retry a few times.
          for i in 1 2 3 4; do
            body=$(curl -s -m 60 https://hacktx-26.onrender.com/api/health) && echo "$body" | grep -q '"status":"ok"' && { echo "ok: $body"; exit 0; }
            echo "attempt $i failed: ${body:-no response}"; sleep 10
          done
          exit 1
